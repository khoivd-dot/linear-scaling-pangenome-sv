AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Pangenome haploblock test: one AWS Batch array job, one PGGB graph per
  recombination-split haploblock, on EC2 Spot. Results go to an S3 bucket.
  Delete the stack to stop all cost except stored results (the bucket is retained).

Parameters:
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets with internet access (the default VPC's public subnets work).
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group allowing outbound HTTPS (the default VPC security group works).
  MaxvCpus:
    Type: Number
    Default: 128
    Description: Upper bound on concurrent vCPUs, which caps spend per hour.
  JobVcpus:
    Type: Number
    Default: 8
  JobMemoryMiB:
    Type: Number
    Default: 30000
  ImageTag:
    Type: String
    Default: v0.6.0-hb1

Resources:
  ResultsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${AWS::StackName}-pggb"
      EmptyOnDelete: true

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  JobRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: results-bucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub "${ResultsBucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ResultsBucket.Arn

  ComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      Type: MANAGED
      State: ENABLED
      ComputeResources:
        Type: SPOT
        AllocationStrategy: SPOT_PRICE_CAPACITY_OPTIMIZED
        MinvCpus: 0
        MaxvCpus: !Ref MaxvCpus
        InstanceTypes: [c7i, c6i, c6a, m7i, m6i, m6a]
        Subnets: !Ref SubnetIds
        SecurityGroupIds: [!Ref SecurityGroupId]
        InstanceRole: !GetAtt InstanceProfile.Arn
        Tags: { Project: pangenome-haploblocks }

  JobQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      Priority: 1
      State: ENABLED
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref ComputeEnvironment

  JobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      Type: container
      PlatformCapabilities: [EC2]
      RetryStrategy:
        Attempts: 3
        EvaluateOnExit:
          - OnStatusReason: "Host EC2*"
            Action: RETRY
          - OnReason: "*"
            Action: EXIT
      Timeout:
        AttemptDurationSeconds: 21600
      ContainerProperties:
        Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${Repository}:${ImageTag}"
        JobRoleArn: !GetAtt JobRole.Arn
        ResourceRequirements:
          - { Type: VCPU, Value: !Ref JobVcpus }
          - { Type: MEMORY, Value: !Ref JobMemoryMiB }
        Environment:
          - { Name: PIPELINE_CONFIG, Value: config/haploblocks.yaml }
          - { Name: RESULTS_S3, Value: !Sub "s3://${ResultsBucket}/results" }

Outputs:
  ResultsBucket:
    Value: !Ref ResultsBucket
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  JobQueue:
    Value: !Ref JobQueue
  JobDefinition:
    Value: !Ref JobDefinition
